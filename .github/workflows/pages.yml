name: Deploy blog to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build managed content and SEO files
        run: |
          node scripts/build.mjs
          node scripts/prepare-deploy.mjs
        env:
          SITE_URL: https://zhiwei-blog-pang.pages.dev
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59d90f49b428eab0d0dad11740f97169
          command: pages deploy . --project-name=zhiwei-blog-pang --branch=main --commit-dirty=true
