locale: zh_Hans
backend:
  name: github
  repo: psk001s/zhiwei-blog
  branch: main
  auth_methods: [token]
media_folder: assets/images/uploads
public_folder: assets/images/uploads
site_url: https://www.shengkai.cc
display_url: https://www.shengkai.cc
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    editor:
      preview: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title, category]
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 正文, name: body, widget: markdown }
      - { label: 发布日期, name: date, widget: datetime, default: "{{now}}", date_format: YYYY-MM-DD, time_format: false }
      - { label: 分类, name: category, widget: string, default: 随笔, hint: 可直接输入已有分类或创建新分类 }
      - { label: 封面图片, name: cover, widget: image, choose_url: true, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
  - name: moments
    label: 朋友圈
    label_singular: 朋友圈
    folder: content/moments
    create: true
    delete: true
    extension: md
    format: frontmatter
    editor:
      preview: false
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{date}} · {{body}}"
    sortable_fields: [date]
    fields:
      - { label: 内容, name: body, widget: markdown }
      - { label: 发布时间, name: date, widget: datetime, default: "{{now}}", date_format: YYYY-MM-DD, time_format: "HH:mm" }
      - { label: 位置, name: location, widget: string, required: false }
      - label: 图片
        name: images
        widget: list
        required: false
        field: { label: 图片, name: image, widget: image }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
  - name: settings
    label: 网站设置
    files:
      - label: 品牌与作者
        name: site
        file: content/site.yml
        fields:
          - { label: 网站名称, name: name, widget: string }
          - { label: 文字 Logo, name: logoText, widget: string }
          - { label: Logo 副标, name: logoSubtitle, widget: string, required: false }
          - { label: Logo 图片, name: logoImage, widget: image, required: false }
          - { label: 作者名称, name: authorName, widget: string }
          - { label: 联系邮箱, name: email, widget: string }
          - { label: 首页 SEO 标题, name: seoTitle, widget: string }
          - { label: 首页 SEO 描述, name: seoDescription, widget: text }
          - { label: 导航 · 首页, name: navHome, widget: string }
          - { label: 导航 · 文章, name: navArticles, widget: string }
          - { label: 导航 · 关于, name: navAbout, widget: string }
          - { label: 导航 · 朋友圈, name: navMoments, widget: string }
          - { label: 首页眉题, name: introEyebrow, widget: string }
          - { label: 首页大标题, name: introTitle, widget: string, hint: 使用竖线分隔换行 }
          - { label: 首页简介, name: introDescription, widget: text }
          - { label: 文章区眉题, name: articlesEyebrow, widget: string }
          - { label: 文章区标题, name: articlesTitle, widget: string }
          - { label: 关于区标记, name: aboutMark, widget: string, hint: 使用竖线分隔换行 }
          - { label: 关于区眉题, name: aboutEyebrow, widget: string }
          - { label: 关于区标题, name: aboutTitle, widget: string }
          - { label: 关于区简介, name: aboutDescription, widget: text }
          - { label: 关于区链接文字, name: aboutLinkText, widget: string }
          - { label: 页脚文字, name: footerText, widget: string }
      - label: 关于我页面
        name: about
        file: content/about.yml
        fields:
          - { label: 页面 SEO 标题, name: seoTitle, widget: string }
          - { label: 页面 SEO 描述, name: seoDescription, widget: text }
          - { label: 眉题, name: eyebrow, widget: string }
          - { label: 主标题, name: title, widget: string, hint: 使用竖线分隔换行 }
          - { label: 个人简介, name: bio, widget: text }
          - { label: 个人图片, name: image, widget: image }
          - { label: 图片说明, name: imageAlt, widget: string }
          - { label: 第一部分标题, name: storyTitle, widget: string }
          - { label: 第一部分正文一, name: storyParagraph1, widget: text }
          - { label: 第一部分正文二, name: storyParagraph2, widget: text }
          - { label: 兴趣部分标题, name: interestsTitle, widget: string }
          - { label: 兴趣标签, name: interests, widget: string, hint: 使用竖线分隔多个标签 }
          - { label: 联系区眉题, name: contactEyebrow, widget: string }
          - { label: 联系区标题, name: contactTitle, widget: string }
          - { label: 联系区说明, name: contactDescription, widget: text }
          - { label: 微信二维码, name: wechatQr, widget: image, required: false }
          - { label: 二维码说明, name: wechatQrAlt, widget: string, required: false }
          - { label: 联系邮箱, name: email, widget: string }
  - name: comment_admin
    label: 评论管理
    files:
      - label: 评论管理
        name: comments
        file: content/comment-admin.yml
        fields:
          - { label: 说明, name: note, widget: string, required: false }
  - name: friend_links
    label: 友情链接
    format: json
    files:
      - label: 友情链接设置
        name: links
        file: content/friend-links.json
        fields:
          - { label: 区域标题, name: title, widget: string, default: 友情链接 }
          - label: 链接列表
            name: links
            widget: list
            required: false
            summary: "{{fields.name}} · {{fields.url}}"
            fields:
              - { label: 网站名称, name: name, widget: string }
              - { label: 网站地址, name: url, widget: string, hint: "请填写完整地址，例如 https://example.com" }
