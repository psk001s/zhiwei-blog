<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>内容管理 · 庞胜凯的个人博客</title>
  <link rel="stylesheet" href="../assets/admin-shell.css?v=2">
</head>
<body>
  <script>
    const redirectCommentAdmin = () => {
      if (location.hash.includes("comment_admin")) location.replace("comments.html");
    };
    const simplifyPostEditor = () => {
      const editingPost = location.hash.includes("/posts/") || location.hash.includes("posts/new");
      document.body.classList.toggle("post-editor-active", editingPost);
      if (!editingPost) return;
      document.querySelectorAll("a, button").forEach(control => {
        if (["预览", "历史"].includes(control.textContent.trim())) control.hidden = true;
      });
    };
    addEventListener("hashchange", redirectCommentAdmin);
    addEventListener("hashchange", simplifyPostEditor);
    redirectCommentAdmin();
    simplifyPostEditor();
    new MutationObserver(simplifyPostEditor).observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener("click", event => {
      const control = event.target.closest("a, button");
      if (control?.textContent.includes("评论管理")) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign("comments.html");
      }
    }, true);
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
