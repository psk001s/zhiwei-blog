storyTitle: 这个博客为何存在
storyParagraph1: 我相信，认真观察日常，本身就是一种创造。这里不是履历表，也不追赶每一个热点。我写阅读留下的痕迹，生活教会我的事，以及那些还没有标准答案的问题。
storyParagraph2: 文章更新得不算频繁。比起速度，我更在意一篇文字是否诚实，是否经得起过一阵子再回头看。
